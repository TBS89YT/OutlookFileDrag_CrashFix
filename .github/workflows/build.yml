name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: VSTO compile (unsigned)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore OutlookFileDrag.sln -NonInteractive
      - name: Compile add-in
        shell: pwsh
        run: |
          msbuild OutlookFileDrag/OutlookFileDrag.csproj /t:Compile /p:Configuration=Release /p:Platform=AnyCPU /p:SignManifests=false /p:VisualStudioVersion=17.0 /nologo /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify assembly version
        shell: pwsh
        run: |
          $file = "OutlookFileDrag/obj/Release/OutlookFileDrag.dll"
          if (-not (Test-Path $file)) { throw "Build output missing: $file" }
          $version = (Get-Item $file).VersionInfo.FileVersion
          if ($version -ne "1.0.13.0") { throw "Unexpected assembly file version: $version" }
